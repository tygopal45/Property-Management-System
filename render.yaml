# Render blueprint. One web service, built from the Dockerfile, serving both the API and the
# browser app on a single origin — see `Property_Rental/api/app/main.py` for why that is one
# service rather than two.
#
# The database is not declared here. Render's free tier offers Postgres but not MySQL, and this
# app is built on MySQL (docs/decisions.md, Decision 5), so the database is an Aiven free MySQL
# service and reaches this service as a DATABASE_URL secret. The SQL is deliberately portable, so
# if that free tier disappears, moving to Render's own Postgres is a change to this one value.

services:
  - type: web
    name: property-rental
    runtime: docker
    plan: free
    region: oregon

    dockerfilePath: ./Property_Rental/Dockerfile
    dockerContext: ./Property_Rental

    # Render restarts an unhealthy instance, and this endpoint answers 503 when the database is
    # unreachable rather than a cheerful 200 — a health check that cannot fail is decoration.
    healthCheckPath: /api/health

    envVars:
      # Generated by Render and never seen by anyone, which is the point. config.py refuses to
      # start on a weak or absent secret, so there is no version of this that quietly ships a
      # default.
      - key: JWT_SECRET
        generateValue: true

      # Set by hand in the dashboard: it carries the database password.
      #   mysql+pymysql://USER:PASSWORD@HOST:PORT/DBNAME
      # Aiven requires TLS, so append: ?ssl_ca=/etc/ssl/certs/ca-certificates.crt
      - key: DATABASE_URL
        sync: false

      # Everything here is HTTPS, so the session cookie must not travel over plain HTTP.
      - key: COOKIE_SECURE
        value: "true"

      # One origin, so this is belt and braces rather than load-bearing. Set it to the service's
      # own URL once Render has assigned one. A wildcard is rejected by config.py on purpose.
      - key: CORS_ORIGINS
        sync: false

      - key: GRACE_PERIOD_DAYS
        value: "5"
