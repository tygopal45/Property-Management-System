# Render blueprint. One web service and one database, both declared here, so deploying is
# *New → Blueprint* and nothing else — there is no connection string to copy and no secret to
# paste anywhere.
#
# The web service serves both the API and the built browser app on a single origin. That is
# deliberate rather than a shortcut: two origins would mean CORS with credentials and a session
# cookie downgraded from `SameSite=Lax` to `SameSite=None`. See `Property_Rental/api/app/main.py`.
#
# The database is Postgres. The app was built on MySQL with deliberately portable SQL, on the
# stated grounds that free managed MySQL is scarce and free Postgres is not — see
# `docs/decisions.md` Decision 5, which predicted this move before any code existed. Render's free
# tier offers Postgres and not MySQL, so the hedge was cashed in.

databases:
  - name: property-rental-db
    databaseName: rental
    user: rental
    plan: free
    region: oregon

services:
  - type: web
    name: property-rental
    runtime: docker
    plan: free
    region: oregon

    dockerfilePath: ./Property_Rental/Dockerfile
    dockerContext: ./Property_Rental

    # Render restarts an unhealthy instance, and this endpoint answers 503 when the database is
    # unreachable rather than a cheerful 200 — a health check that cannot fail is decoration.
    healthCheckPath: /api/health

    envVars:
      # Generated by Render and never seen by anyone, which is the point. config.py refuses to
      # start on a weak or absent secret, so there is no version of this that quietly ships a
      # default.
      - key: JWT_SECRET
        generateValue: true

      # Wired from the database above, so the password exists only inside Render. Render hands out
      # a `postgres://` URL, which SQLAlchemy would route to psycopg 2 — config.py rewrites the
      # scheme to name psycopg 3 rather than relying on anyone remembering to.
      - key: DATABASE_URL
        fromDatabase:
          name: property-rental-db
          property: connectionString

      # Everything here is HTTPS, so the session cookie must not travel over plain HTTP.
      - key: COOKIE_SECURE
        value: "true"

      # One origin, so this is belt and braces rather than load-bearing. Set it to the service's
      # own URL once Render has assigned one. A wildcard is rejected by config.py on purpose.
      - key: CORS_ORIGINS
        sync: false

      - key: GRACE_PERIOD_DAYS
        value: "5"
