# PostgreSQL for local development. The API and Vite run on the host.
services:
  db:
    image: postgres:17-alpine
    container_name: rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      # Bound to the loopback interface, not 0.0.0.0. Published so the host-side API can
      # reach it; without the 127.0.0.1 prefix anyone on the same network could connect
      # with the development credentials above.
      - "127.0.0.1:5432:5432"
    volumes:
      - rental-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers only once the server will accept connections, which is later than
      # the container reporting as started — migrations run against this immediately after.
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rental-postgres-data:
